<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
</head>
<body>
    <h1>Formulir Pendaftaran Lomba</h1>
    <form action="" method="post" enctype="multipart/form-data">

        <h3>Data Tim</h3>
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="namatim"><strong>Nama Tim</strong></label>
                </td>
                <td>
                    <input type="text" id="namatim" name="namatim" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="namaketua"><strong>Nama Ketua</strong></label>
                </td>
                <td>
                    <input type="text" id="namaketua" name="namaketua" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="jumlah"><strong>Jumlah Anggota</strong></label>
                </td>
                <td>
                    <input type="text" id="jumlah" name="jumlah" size="10" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <h3>Pilihan Lomba</h3>
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Kategori Lomba</strong>
                </td>
                <td>
                    <input type="radio" id="individu" name="kategori"
                           value="Individu" />
                    <label for="individu">Individu</label>

                    <input type="radio" id="kelompok" name="kategori"
                           value="Kelompok" />
                    <label for="kelompok">Kelompok</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%; vertical-align:middle;">
                    <strong>Bidang Lomba</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="programming" name="bidang"
                               value="Programming" />
                        <label for="programming">Programming</label>
                    </p>
                    <p>
                        <input type="checkbox" id="uiux" name="bidang"
                               value="UI/UX Design" />
                        <label for="uiux">UI/UX Design</label>
                    </p>
                    <p>
                        <input type="checkbox" id="karyatulis" name="bidang"
                               value="Karya Tulis" />
                        <label for="karyatulis">Karya Tulis</label>
                    </p>
                </td>
            </tr>
        </table>

        <h3>Informasi Karya</h3>
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="deskripsi"><strong>Deskripsi Karya</strong></label>
                </td>
                <td>
                    <textarea id="deskripsi" name="deskripsi"
                              rows="5" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="filekarya"><strong>File Karya</strong></label>
                </td>
                <td>
                    <input type="file" id="filekarya" name="filekarya" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar" value="Daftar" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
